<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor</title>
<link rel="stylesheet" href="../deck-tokens.css" />
<link rel="stylesheet" href="editor.css" />
</head>
<body>
<nav class="rail">
  <a class="back" href="/" title="Library" aria-label="Library">&lt;</a>
</nav>
<main class="view">
  <header class="bar">
    <span class="path"></span>
    <span class="note" role="status"></span>
    <span class="count"></span>
  </header>
  <div class="stage"></div>
</main>
<section class="source" aria-label="Markdown">
  <div class="source-scroll">
    <details class="card front">
      <summary><span>Deck</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>
      <textarea class="front-text" spellcheck="false" aria-label="Front matter"></textarea>
    </details>
    <div class="slides-list"></div>
  </div>
</section>
<script src="../deck-config.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
