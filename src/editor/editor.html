<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor</title>
<link rel="stylesheet" href="../deck-tokens.css" />
<link rel="stylesheet" href="editor.css" />
</head>
<body>
<nav class="rail">
  <a class="back" href="/" title="Library" aria-label="Library">&lt;</a>
</nav>
<section class="source">
  <header class="source-head">
    <span class="count"></span>
    <span class="type"></span>
  </header>
  <div class="field">
    <div class="backdrop" aria-hidden="true"></div>
    <textarea class="text" spellcheck="false" aria-label="Markdown"></textarea>
  </div>
</section>
<main class="view">
  <header class="bar">
    <span class="path"></span>
    <span class="note" role="status"></span>
  </header>
  <div class="stage"></div>
  <nav class="strip" aria-label="Slides"></nav>
</main>
<script src="../deck-config.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
